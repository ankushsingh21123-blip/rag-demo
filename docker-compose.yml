services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ragdemo
      POSTGRES_PASSWORD: ragdemo
      POSTGRES_DB: ragdemo
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  api:
    build: .
    depends_on:
      - db
    environment:
      DATABASE_URL: postgresql://ragdemo:ragdemo@db:5432/ragdemo
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.0-flash}
      GEMINI_EMBED_MODEL: ${GEMINI_EMBED_MODEL:-text-embedding-004}
      STORE: postgres
    ports:
      - "8000:8000"

volumes:
  pgdata:
